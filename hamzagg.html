<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0B0612">
    <title>FawakihAI - Ocean Party</title>

    <style>
        :root {
            --bg-main: #0B0612;
            --bg-panel: #130922;
            --bg-card: #180C2B;
            --primary: #9D4EDD;
            --primary-dark: #5A189A;
            --gold: #F8C000;
            --neon-blue: #00E5FF;
            --neon-pink: #FF00E5;
            --success: #00E676;
            --danger: #FF4757;
            --danger-glow: #FF6B81;
            --text-main: #FFFFFF;
            --text-muted: #8A7A9E;
            --border-color: #2D1B4E;
            --glass-bg: rgba(19, 9, 34, 0.92);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0B0612;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 229, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(157, 78, 221, 0.10) 0%, transparent 50%),
                linear-gradient(135deg, #09040d 0%, #1a0b2e 50%, #0d0616 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
        }

        #dev-logo {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--neon-blue);
            cursor: pointer;
            z-index: 1000;
            object-fit: cover;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
            transition: transform 0.2s ease;
        }
        #dev-logo:active { transform: scale(1.15); }

        #dev-info {
            position: absolute;
            top: 68px;
            right: 15px;
            background: var(--glass-bg);
            border: 1px solid var(--neon-blue);
            padding: 12px 18px;
            border-radius: 14px;
            text-align: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
        }
        #dev-info.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .dev-name { color: var(--gold); font-size: 14px; font-weight: bold; }
        .dev-sub { color: var(--neon-blue); font-size: 12px; margin-top: 3px; }

        /* شاشة النظام الرئيسية */
        #game-screen {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 480px;
            gap: 15px;
            margin-top: 20px;
        }

        .app-header {
            text-align: center;
            margin-bottom: 5px;
            position: relative;
        }
        .app-header h1 {
            font-size: 24px;
            font-weight: 900;
            color: var(--neon-blue);
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }
        .app-header h1 span { color: var(--gold); font-size: 18px; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.25);
            border-radius: 12px;
            padding: 12px 15px;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            gap: 6px;
        }
        .stats-bar span { display: flex; align-items: center; gap: 5px; }
        .stat-value { color: var(--neon-blue); }
        .stat-icon { color: var(--gold); }

        .game-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: var(--bg-card);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid var(--primary);
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.35);
            margin-bottom: 5px;
        }
        #img-wrap {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .game-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: fill;
            opacity: 0.95;
            transition: opacity 0.3s;
        }
        .game-image.analyzing { opacity: 0.5; }

        /* =========================================
           مستشعرات اللمس (Sensors) لجميع العناصر
           ========================================= */
        .sensor {
            position: absolute;
            width: 28%;
            height: 35%;
            transform: translate(-50%, -50%);
            z-index: 50;
            cursor: pointer;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .sensor:hover {
            background: rgba(0, 229, 255, 0.15);
            border-color: rgba(0, 229, 255, 0.4);
        }
        .sensor:active, .sensor.selected {
            background: rgba(0, 229, 255, 0.3);
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.6) inset;
        }

        /* =========================================
           تصميم مؤشر الإصبع الذهبي (Marker)
           ========================================= */
        .marker {
            position: absolute;
            width: 45px;
            height: 45px;
            transform: translate(-50%, -100%);
            display: none;
            z-index: 100;
            pointer-events: none;
            animation: bounceFinger 1s infinite alternate;
        }

        .marker svg {
            width: 100%;
            height: 100%;
            transform: rotate(180deg);
            filter: drop-shadow(0px 0px 10px rgba(248, 192, 0, 0.9)) drop-shadow(0px 5px 5px rgba(0,0,0,0.6));
        }

        .marker.marker-special svg {
            filter: drop-shadow(0px 0px 15px rgba(255, 215, 0, 1)) drop-shadow(0px 5px 5px rgba(0,0,0,0.6));
        }

        @keyframes bounceFinger {
            from { transform: translate(-50%, -100%); }
            to { transform: translate(-50%, -120%); }
        }

        /* منطقة التسجيل */
        .registered-area {
            display: none;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: var(--gold);
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 10px;
            border: 1px dashed var(--gold);
            margin-bottom: 10px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .start-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00E676, #00B0FF, #F8C000);
            color: #000;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4);
            transition: transform 0.2s ease;
        }
        .start-btn:active { transform: scale(0.97); }
        .start-btn:disabled {
            background: #2D1B4E;
            color: #8A7A9E;
            box-shadow: none;
            cursor: not-allowed;
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 15px;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: bold;
            color: var(--primary);
        }
        
        .predictions-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
        }
        .pred-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            position: relative;
            cursor: pointer;
            flex: 0 0 calc(50% - 5px);
            max-width: calc(50% - 5px);
        }

        .pred-card.special-red {
            border: 2px solid var(--gold);
            background: linear-gradient(145deg, rgba(248, 192, 0, 0.18), rgba(248, 192, 0, 0.05));
            animation: goldGlowPulse 2s ease-in-out infinite;
        }

        @keyframes goldGlowPulse {
            0%, 100% { box-shadow: 0 0 12px rgba(248, 192, 0, 0.55); }
            50% { box-shadow: 0 0 22px rgba(248, 192, 0, 0.85); }
        }

        .pred-type { font-size: 10px; color: var(--text-muted); text-align: right; margin-bottom: 5px; }
        .pred-title { font-size: 15px; font-weight: bold; color: white; text-align: center; margin-bottom: 5px; }
        .progress-track { width: 100%; height: 4px; background: #25163D; border-radius: 2px; overflow: hidden; margin-bottom: 5px; }
        .progress-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.8s ease; }
        .pred-footer { font-size: 10px; color: var(--text-muted); text-align: center; }

        .system-log {
            background: #060309;
            border: 1px solid #1E1035;
            border-radius: 8px;
            padding: 10px;
            height: 100px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            color: #A093B5;
            direction: ltr;
            text-align: left;
        }
        .log-highlight { color: var(--success); }

        .analyzing-bar {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            color: var(--primary);
            font-weight: bold;
            font-size: 14px;
        }

    </style>
</head>
<body>

    <img src="hamza.jpg" id="dev-logo" alt="Developer" onclick="showDevInfo()">
    <div id="dev-info">
        <div class="dev-name">hamza elhumada</div>
        <div class="dev-sub">nbras</div>
    </div>

    <!-- شاشة النظام الرئيسية -->
    <div id="game-screen">
        
        <div class="app-header">
            <h1>🌊 OCEAN PARTY <span>v1.0</span></h1>
        </div>

        <div class="game-container">
            <div id="img-wrap">
                <!-- صورة اللعبة -->
                <img src="hamzacc.jpg" alt="Ocean Party" class="game-image" id="main-image">

                <!-- مستشعرات شفافة للضغط (تسجيل النتيجة) -->
                <div class="sensor" onclick="registerItem('سلحفاة 12x', 1)" style="top: 22%; left: 16%;"></div>
                <div class="sensor" onclick="registerItem('دولفين 35x', 2)" style="top: 22%; left: 50%;"></div>
                <div class="sensor" onclick="registerItem('قرش 100x', 3)" style="top: 22%; left: 84%;"></div>
                <div class="sensor" onclick="registerItem('سلحفاة 4x', 4)" style="top: 55%; left: 13%;"></div>
                <div class="sensor" onclick="registerItem('دولفين 4x', 5)" style="top: 55%; left: 38%;"></div>
                <div class="sensor" onclick="registerItem('قرش 4x', 6)" style="top: 55%; left: 62%;"></div>
                <div class="sensor" onclick="registerItem('مختلط 6x', 7)" style="top: 55%; left: 87%;"></div>

                <!-- 4 مؤشرات إصبع ذهبي -->
                <div id="marker-1" class="marker">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#FFF3B0" />
                                <stop offset="40%" stop-color="#F8C000" />
                                <stop offset="100%" stop-color="#C68E17" />
                            </linearGradient>
                        </defs>
                        <path d="M10.5 15.5V4.5C10.5 3.67 11.17 3 12 3C12.83 3 13.5 3.67 13.5 4.5V11H15V6.5C15 5.67 15.67 5 16.5 5C17.33 5 18 5.67 18 6.5V11H19.5V8.5C19.5 7.67 20.17 7 21 7C21.83 7 22.5 7.67 22.5 8.5V15C22.5 19.42 18.92 23 14.5 23C10.08 23 6.5 19.42 6.5 15V12.5C6.5 11.67 7.17 11 8 11C8.83 11 9.5 11.67 9.5 12.5V15.5H10.5Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1.5"/>
                    </svg>
                </div>
                
                <div id="marker-2" class="marker">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10.5 15.5V4.5C10.5 3.67 11.17 3 12 3C12.83 3 13.5 3.67 13.5 4.5V11H15V6.5C15 5.67 15.67 5 16.5 5C17.33 5 18 5.67 18 6.5V11H19.5V8.5C19.5 7.67 20.17 7 21 7C21.83 7 22.5 7.67 22.5 8.5V15C22.5 19.42 18.92 23 14.5 23C10.08 23 6.5 19.42 6.5 15V12.5C6.5 11.67 7.17 11 8 11C8.83 11 9.5 11.67 9.5 12.5V15.5H10.5Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1.5"/>
                    </svg>
                </div>

                <div id="marker-3" class="marker">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10.5 15.5V4.5C10.5 3.67 11.17 3 12 3C12.83 3 13.5 3.67 13.5 4.5V11H15V6.5C15 5.67 15.67 5 16.5 5C17.33 5 18 5.67 18 6.5V11H19.5V8.5C19.5 7.67 20.17 7 21 7C21.83 7 22.5 7.67 22.5 8.5V15C22.5 19.42 18.92 23 14.5 23C10.08 23 6.5 19.42 6.5 15V12.5C6.5 11.67 7.17 11 8 11C8.83 11 9.5 11.67 9.5 12.5V15.5H10.5Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1.5"/>
                    </svg>
                </div>

                <div id="marker-4" class="marker marker-special">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10.5 15.5V4.5C10.5 3.67 11.17 3 12 3C12.83 3 13.5 3.67 13.5 4.5V11H15V6.5C15 5.67 15.67 5 16.5 5C17.33 5 18 5.67 18 6.5V11H19.5V8.5C19.5 7.67 20.17 7 21 7C21.83 7 22.5 7.67 22.5 8.5V15C22.5 19.42 18.92 23 14.5 23C10.08 23 6.5 19.42 6.5 15V12.5C6.5 11.67 7.17 11 8 11C8.83 11 9.5 11.67 9.5 12.5V15.5H10.5Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1.5"/>
                    </svg>
                </div>

            </div>
        </div>

        <!-- شريط عرض النتيجة المسجلة -->
        <div id="registered-area" class="registered-area">
            📝 تم تسجيل النتيجة: <span id="registered-text" style="color: #fff; font-weight: 900;">--</span>
        </div>

        <div class="stats-bar">
            <span><span class="stat-icon">⏱</span> جولة: <span class="stat-value" id="round-timer">0</span></span>
            <span><span class="stat-icon">👤</span> <span class="stat-value" id="online-count">0</span></span>
        </div>

        <div class="controls-container">
            <!-- زر بدء الجولة -->
            <button id="start-round-btn" class="start-btn" onclick="startNewRound()">بدء جولة جديدة 🚀</button>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span>🎯 توقعات المحيط</span>
            </div>
            <div class="analyzing-bar" id="analyzing-ui">جاري التحليل... 🧠</div>
            <div class="predictions-grid" id="predictions-grid">
                <div style="width: 100%; text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px;">
                    اضغط "بدء جولة جديدة" لاستخراج 4 توقعات
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header"><span>📋 سجل النظام</span></div>
            <div class="system-log" id="system-log">
                <div><span class="log-time">[نظام]</span> 🌊 OCEAN PARTY AI - جاهز للعمل</div>
            </div>
        </div>

    </div>

    <script>
        function showDevInfo() {
            const infoBox = document.getElementById('dev-info');
            infoBox.classList.add('show');
            setTimeout(() => { infoBox.classList.remove('show'); }, 3000); 
        }

        // بيانات جميع العناصر السبعة في الصورة
        const allElements = [
            { id: 1, name: 'سلحفاة 12x', icon: '🐢', mult: 'x12', weight: 15, top: '22%', left: '16%' }, // نادر خفيف
            { id: 2, name: 'دولفين 35x', icon: '🐬', mult: 'x35', weight: 5, top: '22%', left: '50%' },  // نادر
            { id: 3, name: 'قرش 100x', icon: '🦈', mult: 'x100', weight: 1, top: '22%', left: '84%' },  // نادر جداً
            { id: 4, name: 'سلحفاة 4x', icon: '🐢', mult: 'x4', weight: 25, top: '55%', left: '13%' },   // عادي
            { id: 5, name: 'دولفين 4x', icon: '🐬', mult: 'x4', weight: 25, top: '55%', left: '38%' },   // عادي
            { id: 6, name: 'قرش 4x', icon: '🦈', mult: 'x4', weight: 25, top: '55%', left: '62%' },     // عادي
            { id: 7, name: 'مختلط 6x', icon: '🌊', mult: 'x6', weight: 25, top: '55%', left: '87%' }     // عادي
        ];

        let lastRegisteredId = null; // لتخزين آخر شيء سجله المستخدم ليتعلم منه الذكاء الاصطناعي
        let currentRoundTime = 26;
        let roundInterval;
        let isGuessingAllowed = true;

        window.onload = function() {
            document.getElementById('online-count').innerText = Math.floor(Math.random() * 500) + 100;
        };

        // دالة تسجيل العنصر عند الضغط عليه
        function registerItem(name, id) {
            lastRegisteredId = id;
            const regArea = document.getElementById('registered-area');
            const regText = document.getElementById('registered-text');
            
            regText.innerText = name;
            regArea.style.display = 'block';
            
            // إضافة تأثير بصري للمستشعر الذي تم النقر عليه
            document.querySelectorAll('.sensor').forEach(s => s.classList.remove('selected'));
            event.target.classList.add('selected');

            addSystemLog(`📝 المستخدم سجل: [${name}] - الذكاء الاصطناعي سيتعلم من هذا!`);
        }

        // خوارزمية التخمين الذكية مع الأوزان النادرة
        function generateSmartPrediction() {
            // نسخ العناصر لإضافة الأوزان الديناميكية
            let pool = allElements.map(el => {
                let dynamicWeight = el.weight;
                
                // الذكاء الاصطناعي يتعلم: إذا سجل المستخدم عنصراً، نزيد احتمالية توقعه في الجولة القادمة قليلاً
                if (lastRegisteredId === el.id) {
                    dynamicWeight += 20; 
                }

                return {
                    ...el,
                    randomScore: Math.random() * dynamicWeight // النتيجة تعتمد على الوزن
                };
            });

            // ترتيب العناصر تنازلياً حسب النتيجة العشوائية الموزونة
            pool.sort((a, b) => b.randomScore - a.randomScore);

            // نأخذ أفضل 4 عناصر كتوقعات
            let top4 = pool.slice(0, 4);

            // حساب نسبة الثقة بشكل عشوائي وجمالي
            return top4.map((item, index) => {
                return {
                    ...item,
                    confidence: Math.floor(Math.random() * 10) + (89 - index * 2) // ثقة تتراوح بين 83% و 98%
                };
            });
        }

        function addSystemLog(msg) {
            const logBox = document.getElementById('system-log');
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            logBox.innerHTML += `<div><span class="log-time">[${time}]</span> <span class="log-highlight">${msg}</span></div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function renderPredictions(predictions) {
            const grid = document.getElementById('predictions-grid');
            grid.innerHTML = '';

            predictions.forEach((pred, index) => {
                // إذا كان العنصر 100x نعطيه كلاس مميز
                const isSpecial = pred.id === 3; 
                const specialClass = isSpecial ? 'special-red' : '';

                grid.innerHTML += `
                    <div class="pred-card ${specialClass}">
                        <div class="pred-type">توقع ${index + 1}</div>
                        <div class="pred-title">${pred.name} ${pred.icon}</div>
                        <div class="progress-track">
                            <div class="progress-fill" style="width: ${pred.confidence}%; background: ${isSpecial ? 'var(--gold)' : 'var(--success)'};"></div>
                        </div>
                        <div class="pred-footer">ثقة: ${pred.confidence}%</div>
                    </div>
                `;
            });
        }

        function startNewRound() {
            if (!isGuessingAllowed) return;

            const btn = document.getElementById('start-round-btn');
            const mainImg = document.getElementById('main-image');
            const grid = document.getElementById('predictions-grid');
            const analyzingUI = document.getElementById('analyzing-ui');
            
            // إخفاء المؤشرات القديمة وإزالة التحديد من المستشعرات
            for(let i=1; i<=4; i++) {
                const m = document.getElementById('marker-'+i);
                if (m) m.style.display = 'none';
            }
            document.querySelectorAll('.sensor').forEach(s => s.classList.remove('selected'));
            document.getElementById('registered-area').style.display = 'none';
            
            grid.style.display = 'none';
            analyzingUI.style.display = 'flex';
            mainImg.classList.add('analyzing');
            addSystemLog("🚀 بدء تحليل المحيط بناءً على معطياتك...");
            
            btn.disabled = true;
            btn.innerText = "جاري التحليل...";
            isGuessingAllowed = false;

            setTimeout(() => {
                // استخدام الخوارزمية الموزونة
                let predictions = generateSmartPrediction();
                
                analyzingUI.style.display = 'none';
                grid.style.display = 'flex';
                renderPredictions(predictions);

                // عرض المؤشرات على الأماكن المتوقعة
                predictions.forEach((pred, index) => {
                    let marker = document.getElementById('marker-' + (index + 1));
                    if (marker) {
                        marker.style.top = pred.top;
                        marker.style.left = pred.left;
                        marker.style.display = 'block';
                    }
                });

                mainImg.classList.remove('analyzing');
                addSystemLog("✅ تم استخراج 4 توقعات بنجاح");
                
                // تصفير المتغير بعد التعلم منه
                lastRegisteredId = null;

                startActiveRoundTimer();
            }, 1500);
        }

        function startActiveRoundTimer() {
            currentRoundTime = 26;
            const btn = document.getElementById('start-round-btn');
            const timerDisplay = document.getElementById('round-timer');
            
            btn.innerText = `الرجاء الانتظار (${currentRoundTime})`;
            timerDisplay.innerText = currentRoundTime;

            if (roundInterval) clearInterval(roundInterval);

            roundInterval = setInterval(() => {
                currentRoundTime--;
                if (currentRoundTime > 0) {
                    btn.innerText = `الرجاء الانتظار (${currentRoundTime})`;
                    timerDisplay.innerText = currentRoundTime;
                } else {
                    clearInterval(roundInterval);
                    timerDisplay.innerText = "0";
                    addSystemLog("⏳ انتهت الجولة. اضغط على المربع الذي ظهر لتسجيله.");
                    resetEngineUI();
                }
            }, 1000);
        }

        function resetEngineUI() {
            const btn = document.getElementById('start-round-btn');
            btn.disabled = false;
            btn.innerText = "بدء جولة جديدة 🚀";
            document.getElementById('main-image').classList.remove('analyzing');
            isGuessingAllowed = true;
        }
    </script>
</body>
</html>
