<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#02121a">
    <title>FawakihAI - Ocean Party</title>

    <style>
        :root {
            /* ألوان المحيط العميق الجديدة */
            --bg-main: #02121a;
            --bg-panel: rgba(5, 30, 45, 0.7);
            --bg-card: rgba(8, 45, 65, 0.9);
            --primary: #00E5FF;
            --primary-dark: #0077B6;
            --gold: #F8C000;
            --neon-blue: #00E5FF;
            --neon-pink: #FF00E5;
            --success: #00E676;
            --danger: #FF4757;
            --text-main: #FFFFFF;
            --text-muted: #8FBDD4;
            --border-color: rgba(0, 229, 255, 0.3);
            --glass-bg: rgba(5, 30, 45, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 119, 182, 0.2) 0%, transparent 60%),
                radial-gradient(circle at 10% 90%, rgba(0, 229, 255, 0.1) 0%, transparent 50%),
                linear-gradient(180deg, #02121a 0%, #032433 50%, #011017 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* =========================================
           شاشة التحميل (Splash Screen)
           ========================================= */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #02121a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .dolphin-svg {
            width: 180px;
            height: 180px;
            animation: swimDolphin 3s infinite ease-in-out;
            filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.5));
        }

        @keyframes swimDolphin {
            0% { transform: translateX(-30px) translateY(0) rotate(-5deg); }
            25% { transform: translateX(0) translateY(-15px) rotate(0deg); }
            50% { transform: translateX(30px) translateY(0) rotate(5deg); }
            75% { transform: translateX(0) translateY(15px) rotate(0deg); }
            100% { transform: translateX(-30px) translateY(0) rotate(-5deg); }
        }

        .splash-title {
            color: var(--neon-blue);
            font-size: 24px;
            font-weight: 900;
            margin-top: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
            animation: pulseText 1.5s infinite alternate;
        }

        @keyframes pulseText {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        /* =========================================
           العناصر الأساسية
           ========================================= */
        #dev-logo {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--neon-blue);
            cursor: pointer;
            z-index: 1000;
            object-fit: cover;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
            transition: transform 0.2s ease;
        }
        #dev-logo:active { transform: scale(1.15); }

        #dev-info {
            position: absolute;
            top: 68px;
            right: 15px;
            background: var(--glass-bg);
            border: 1px solid var(--neon-blue);
            padding: 12px 18px;
            border-radius: 14px;
            text-align: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
        }
        #dev-info.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .dev-name { color: var(--gold); font-size: 14px; font-weight: bold; }
        .dev-sub { color: var(--neon-blue); font-size: 12px; margin-top: 3px; }

        /* شاشة النظام الرئيسية */
        #game-screen {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 480px;
            gap: 15px;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #game-screen.visible { opacity: 1; }

        .app-header {
            text-align: center;
            margin-bottom: 5px;
            position: relative;
        }
        .app-header h1 {
            font-size: 26px;
            font-weight: 900;
            color: var(--neon-blue);
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
        }
        .app-header h1 span { color: var(--gold); font-size: 18px; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            border: 1px solid var(--primary-dark);
            box-shadow: 0 0 15px rgba(0, 119, 182, 0.3);
            border-radius: 12px;
            padding: 12px 15px;
            font-size: 13px;
            font-weight: bold;
            color: var(--text-muted);
            gap: 6px;
        }
        .stats-bar span { display: flex; align-items: center; gap: 5px; }
        .stat-value { color: var(--neon-blue); }
        .stat-icon { color: var(--gold); }

        .game-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: var(--bg-card);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid var(--primary-dark);
            box-shadow: 0 0 25px rgba(0, 119, 182, 0.4);
            margin-bottom: 5px;
        }
        #img-wrap {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .game-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: fill;
            opacity: 0.95;
            transition: opacity 0.3s;
        }
        .game-image.analyzing { opacity: 0.5; }

        /* =========================================
           مستشعرات اللمس (Sensors) 
           ========================================= */
        .sensor {
            position: absolute;
            width: 28%;
            height: 35%;
            transform: translate(-50%, -50%);
            z-index: 50;
            cursor: default;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        
        .sensor.active {
            pointer-events: auto;
            cursor: pointer;
            border-color: rgba(0, 229, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3) inset;
            animation: pulseSensor 1.5s infinite alternate;
        }
        
        @keyframes pulseSensor {
            from { box-shadow: 0 0 5px rgba(0, 229, 255, 0.3) inset; border-color: rgba(0, 229, 255, 0.3); }
            to { box-shadow: 0 0 20px rgba(0, 229, 255, 0.8) inset; border-color: rgba(0, 229, 255, 0.8); }
        }

        .sensor.active:hover {
            background: rgba(0, 229, 255, 0.2);
        }
        .sensor.active:active, .sensor.selected {
            background: rgba(0, 229, 255, 0.4);
            border-color: var(--neon-blue);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.8) inset;
            animation: none;
        }

        /* =========================================
           المؤشرات (Markers)
           ========================================= */
        .marker {
            position: absolute;
            width: 45px;
            height: 45px;
            transform: translate(-50%, -100%);
            display: none;
            z-index: 100;
            pointer-events: none;
            animation: bounceFinger 1s infinite alternate;
        }

        .marker svg {
            width: 100%;
            height: 100%;
            transform: rotate(180deg);
            filter: drop-shadow(0px 0px 10px rgba(248, 192, 0, 0.9)) drop-shadow(0px 5px 5px rgba(0,0,0,0.6));
        }

        .marker.marker-special-red svg {
            filter: drop-shadow(0px 0px 15px rgba(255, 0, 0, 1)) drop-shadow(0px 5px 5px rgba(0,0,0,0.6));
        }

        @keyframes bounceFinger {
            from { transform: translate(-50%, -100%); }
            to { transform: translate(-50%, -120%); }
        }

        /* منطقة التسجيل */
        .registered-area {
            display: none;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: var(--gold);
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 10px;
            border: 1px dashed var(--gold);
            margin-bottom: 10px;
            animation: fadeIn 0.3s ease;
            box-shadow: 0 0 15px rgba(248, 192, 0, 0.2);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* زر بدء الجولة */
        .start-btn {
            position: relative;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #00E5FF, #0055FF, #00E5FF);
            background-size: 200% auto;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            font-size: 18px;
            font-weight: 900;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.4), inset 0 2px 5px rgba(255,255,255,0.4);
            transition: all 0.3s ease;
            overflow: hidden;
            animation: gradientMove 3s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .start-btn:active:not(:disabled) {
            transform: scale(0.96);
            box-shadow: 0 2px 10px rgba(0, 229, 255, 0.6);
        }
        
        .start-btn:disabled {
            background: #0f2b3a;
            color: var(--text-muted);
            border-color: transparent;
            box-shadow: none;
            cursor: not-allowed;
            animation: none;
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: bold;
            color: var(--neon-blue);
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.3);
        }
        
        /* تعديل شبكة التوقعات لتستوعب 5 بطاقات */
        .predictions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
        }
        .pred-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            position: relative;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        /* البطاقة الخامسة تأخذ صفاً كاملاً */
        .pred-card:nth-child(5) {
            grid-column: span 2;
        }

        .pred-card.special-red {
            border: 2px solid var(--danger);
            background: linear-gradient(145deg, rgba(255, 71, 87, 0.15), rgba(255, 71, 87, 0.05));
            animation: redGlowPulse 2s ease-in-out infinite;
        }

        @keyframes redGlowPulse {
            0%, 100% { box-shadow: 0 0 12px rgba(255, 71, 87, 0.4); }
            50% { box-shadow: 0 0 22px rgba(255, 71, 87, 0.7); }
        }

        .pred-type { font-size: 10px; color: var(--text-muted); text-align: right; margin-bottom: 5px; }
        .pred-title { font-size: 15px; font-weight: bold; color: white; text-align: center; margin-bottom: 5px; }
        .progress-track { width: 100%; height: 4px; background: #0d2b3d; border-radius: 2px; overflow: hidden; margin-bottom: 5px; }
        .progress-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.8s ease; }
        .pred-footer { font-size: 10px; color: var(--text-muted); text-align: center; }

        .system-log {
            background: #01080c;
            border: 1px solid #0f2b3a;
            border-radius: 8px;
            padding: 10px;
            height: 100px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            color: #A093B5;
            direction: ltr;
            text-align: left;
        }
        .log-highlight { color: var(--neon-blue); }

        .analyzing-bar {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            color: var(--neon-blue);
            font-weight: bold;
            font-size: 14px;
        }

    </style>
</head>
<body>

    <!-- شاشة التحميل -->
    <div id="splash-screen">
        <div class="dolphin-svg">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="dolphinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00E5FF" />
                        <stop offset="100%" stop-color="#0077B6" />
                    </linearGradient>
                </defs>
                <!-- جسم الدولفين -->
                <path d="M 25 50 C 30 30, 60 20, 80 40 C 90 50, 85 70, 60 75 C 40 80, 20 65, 25 50 Z" fill="url(#dolphinGrad)"/>
                <!-- الزعنفة العلوية -->
                <path d="M 50 28 C 55 15, 65 15, 70 25 C 65 28, 60 30, 50 28 Z" fill="#00E5FF"/>
                <!-- الزعنفة الصدرية -->
                <path d="M 45 60 C 50 70, 60 75, 65 70 C 60 60, 50 55, 45 60 Z" fill="#0077B6"/>
                <!-- الذيل -->
                <path d="M 25 50 C 15 40, 5 30, 10 25 C 15 35, 20 40, 25 50 Z" fill="#00E5FF"/>
                <path d="M 25 50 C 15 60, 5 70, 10 75 C 15 65, 20 60, 25 50 Z" fill="#00E5FF"/>
                <!-- العين -->
                <circle cx="72" cy="45" r="3" fill="#FFF"/>
                <circle cx="73" cy="45" r="1.5" fill="#000"/>
                <!-- الفم -->
                <path d="M 82 52 Q 78 58 70 58" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
                <!-- الفقاعات -->
                <circle cx="90" cy="35" r="3" fill="none" stroke="#FFF" stroke-width="1" opacity="0.6"/>
                <circle cx="95" cy="25" r="2" fill="none" stroke="#FFF" stroke-width="1" opacity="0.6"/>
            </svg>
        </div>
        <div class="splash-title">جاري تحميل المحيط...</div>
    </div>

    <img src="hamza.jpg" id="dev-logo" alt="Developer" onclick="showDevInfo()">
    <div id="dev-info">
        <div class="dev-name">hamza elhumada</div>
        <div class="dev-sub">nbras</div>
    </div>

    <!-- شاشة النظام الرئيسية -->
    <div id="game-screen">
        
        <div class="app-header">
            <h1>🌊 OCEAN PARTY <span>v1.0</span></h1>
        </div>

        <div class="game-container">
            <div id="img-wrap">
                <!-- صورة اللعبة -->
                <img src="hamzacc.jpg" alt="Ocean Party" class="game-image" id="main-image">

                <!-- مستشعرات شفافة للضغط (تسجيل النتيجة) -->
                <div class="sensor" onclick="registerItem('سلحفاة 12x', 1)" style="top: 22%; left: 16%;"></div>
                <div class="sensor" onclick="registerItem('دولفين 35x', 2)" style="top: 22%; left: 50%;"></div>
                <div class="sensor" onclick="registerItem('قرش 100x', 3)" style="top: 22%; left: 84%;"></div>
                <div class="sensor" onclick="registerItem('سلحفاة 4x', 4)" style="top: 55%; left: 13%;"></div>
                <div class="sensor" onclick="registerItem('دولفين 4x', 5)" style="top: 55%; left: 38%;"></div>
                <div class="sensor" onclick="registerItem('قرش 4x', 6)" style="top: 55%; left: 62%;"></div>
                <div class="sensor" onclick="registerItem('مختلط 6x', 7)" style="top: 55%; left: 87%;"></div>

                <!-- المؤشرات الذهبية (1 إلى 4) -->
                <div id="marker-1" class="marker">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#FFF3B0" />
                                <stop offset="40%" stop-color="#F8C000" />
                                <stop offset="100%" stop-color="#C68E17" />
                            </linearGradient>
                        </defs>
                        <path d="M10.5 15.5V4.5C10.5 3.67 11.17 3 12 3C12.83 3 13.5 3.67 13.5 4.5V11H15V6.5C15 5.67 15.67 5 16.5 5C17.33 5 18 5.67 18 6.5V11H19.5V8.5C19.5 7.67 20.17 7 21 7C21.83 7 22.5 7.67 22.5 8.5V15C22.5 19.42 18.92 23 14.5 23C10.08 23 6.5 19.42 6.5 15V12.5C6.5 11.67 7.17 11 8 11C8.83 11 9.5 11.67 9.5 12.5V15.5H10.5Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1.5"/>

                </div>
                
                <div id="marker-2" class="marker">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10.5 15.5V4.5C10.5 3.67 11.17 3 12 3C12.83 3 13.5 3.67 13.5 4.5V11H15V6.5C15 5.67 15.67 5 16.5 5C17.33 5 18 5.67 18 6.5V11H19.5V8.5C19.5 7.67 20.17 7 21 7C21.83 7 22.5 7.67 22.5 8.5V15C22.5 19.42 18.92 23 14.5 23C10.08 23 6.5 19.42 6.5 15V12.5C6.5 11.67 7.17 11 8 11C8.83 11 9.5 11.67 9.5 12.5V15.5H10.5Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1.5"/>
                    </svg>
                </div>

                <div id="marker-3" class="marker">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10.5 15.5V4.5C10.5 3.67 11.17 3 12 3C12.83 3 13.5 3.67 13.5 4.5V11H15V6.5C15 5.67 15.67 5 16.5 5C17.33 5 18 5.67 18 6.5V11H19.5V8.5C19.5 7.67 20.17 7 21 7C21.83 7 22.5 7.67 22.5 8.5V15C22.5 19.42 18.92 23 14.5 23C10.08 23 6.5 19.42 6.5 15V12.5C6.5 11.67 7.17 11 8 11C8.83 11 9.5 11.67 9.5 12.5V15.5H10.5Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1.5"/>
                    </svg>
                </div>

                <div id="marker-4" class="marker">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                <!-- المؤشر الخامس (الأحمر - يظهر متأخراً) -->

                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">

        <!-- شريط عرض النتيجة المسجلة -->
        <div id="registered-area" class="registered-area">
            📝 تم تسجيل النتيجة بنجاح: <span id="registered-text" style="color: #fff; font-weight: 900;">--</span>
        </div>

        <div class="stats-bar">
            <span><span class="stat-icon">⏱</span> جولة: <span class="stat-value" id="round-timer">0</span></span>
            <span><span class="stat-icon">👤</span> <span class="stat-value" id="online-count">0</span></span>
        </div>

        <div class="controls-container">
            <!-- زر بدء الجولة -->
            <button id="start-round-btn" class="start-btn" onclick="startNewRound()">بدء جولة جديدة 🚀</button>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span>🎯 توقعات المحيط</span>
            </div>

            <div class="predictions-grid" id="predictions-grid">
                <div style="width: 100%; text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px; grid-column: span 2;">
                    اضغط "بدء جولة جديدة" لاستخراج 5 توقعات
                </div>

            </div>

    </div>

    <script>
        // إخفاء شاشة التحميل بعد 3 ثواني
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const gameScreen = document.getElementById('game-screen');
                
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    gameScreen.classList.add('visible');
                }, 500);
            }, 3000);
        });

        function showDevInfo() {
            const infoBox = document.getElementById('dev-info');
            infoBox.classList.add('show');
            setTimeout(() => { infoBox.classList.remove('show'); }, 3000); 
        }

        // بيانات جميع العناصر السبعة في الصورة
        const allElements = [
            { id: 1, name: 'سلحفاة 12x', icon: '🐢', mult: 'x12', weight: 15, top: '22%', left: '16%', type: 'common' },
            { id: 2, name: 'دولفين 35x', icon: '🐬', mult: 'x35', weight: 5, top: '22%', left: '50%', type: 'rare' },
            { id: 3, name: 'قرش 100x', icon: '🦈', mult: 'x100', weight: 1, top: '22%', left: '84%', type: 'rare' },
            { id: 4, name: 'سلحفاة 4x', icon: '🐢', mult: 'x4', weight: 25, top: '55%', left: '13%', type: 'common' },
            { id: 5, name: 'دولفين 4x', icon: '🐬', mult: 'x4', weight: 25, top: '55%', left: '38%', type: 'common' },
            { id: 6, name: 'قرش 4x', icon: '🦈', mult: 'x4', weight: 25, top: '55%', left: '62%', type: 'common' },
            { id: 7, name: 'مختلط 6x', icon: '🌊', mult: 'x6', weight: 25, top: '55%', left: '87%', type: 'common' }
        ];

        let lastRegisteredId = null; 
        let currentRoundTime = 26;
        let roundInterval;
        
        let roundState = 'idle'; 
        let hasRegisteredThisRound = false;

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('online-count').innerText = Math.floor(Math.random() * 500) + 100;
        });

        function registerItem(name, id) {
            if (roundState !== 'ended') {
                addSystemLog("⚠️ لا يمكنك تسجيل النتيجة إلا بعد انتهاء الوقت!");
                return;
            }
            if (hasRegisteredThisRound) {
                addSystemLog("⚠️ لقد قمت بتسجيل النتيجة لهذه الجولة مسبقاً!");
                return;
            }

            lastRegisteredId = id;
            hasRegisteredThisRound = true;
            
            const regArea = document.getElementById('registered-area');
            const regText = document.getElementById('registered-text');
            
            regText.innerText = name;
            regArea.style.display = 'block';
            
            document.querySelectorAll('.sensor').forEach(s => {
                s.classList.remove('active'); 
                s.classList.remove('selected'); 
            });
            event.target.classList.add('selected'); 

            addSystemLog(`🧠 تم تسجيل [${name}]. الذكاء الاصطناعي تعلم من هذه الجولة!`);
            
            const btn = document.getElementById('start-round-btn');
            btn.innerText = "بدء جولة جديدة (تم التعلم) 🚀";
            btn.disabled = false;
        }

        // خوارزمية التخمين (4 عادية + 1 نادرة)
        function generateSmartPrediction() {
            // 1. فصل العناصر
            let commonElements = allElements.filter(el => el.type === 'common');
            let rareElements = allElements.filter(el => el.type === 'rare');

            // 2. اختيار 4 عناصر عشوائية من العادية (بدون تكرار)
            let shuffledCommon = [...commonElements].sort(() => 0.5 - Math.random());
            let selectedCommon = shuffledCommon.slice(0, 4);

            // 3. اختيار عنصر واحد من النادرة (ترجيح 35x أكثر من 100x)
            let selectedRare;
            if (Math.random() < 0.75) {
                selectedRare = rareElements.find(el => el.id === 2); // 35x
            } else {
                selectedRare = rareElements.find(el => el.id === 3); // 100x
            }

            // دمجهم
            let finalPredictions = [...selectedCommon, selectedRare];

            // 4. إضافة تأثير تعلم الذكاء الاصطناعي (إذا سجل المستخدم سابقاً)
            finalPredictions = finalPredictions.map(item => {
                let finalItem = { ...item };
                if (lastRegisteredId === item.id) {
                    // زيادة بسيطة في الثقة إذا كان هذا ما اختاره المستخدم سابقاً
                    finalItem.confidenceBonus = 5; 
                } else {
                    finalItem.confidenceBonus = 0;
                }
                return finalItem;
            });

            // 5. حساب الثقة النهائية
            return finalPredictions.map((item, index) => {
                let baseConfidence = Math.floor(Math.random() * 10) + (89 - index * 2);
                return {
                    ...item,
                    confidence: Math.min(99, baseConfidence + (item.confidenceBonus || 0))
                };
            });
        }

        function addSystemLog(msg) {
            const logBox = document.getElementById('system-log');
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            logBox.innerHTML += `<div><span class="log-time">[${time}]</span> <span class="log-highlight">${msg}</span></div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function renderPredictions(predictions) {
            const grid = document.getElementById('predictions-grid');
            grid.innerHTML = '';

            predictions.forEach((pred, index) => {
                const isRare = pred.type === 'rare'; 
                const specialClass = isRare ? 'special-red' : '';
                
                // البطاقة الخامسة (النادرة) تكون مخفية في البداية
                const isHidden = index === 4 ? 'style="display: none;"' : '';
                const cardId = index === 4 ? 'id="pred-card-5"' : '';

                grid.innerHTML += `
                    <div class="pred-card ${specialClass}" ${cardId} ${isHidden}>
                        <div class="pred-type">توقع ${index + 1} ${isRare ? '👑' : ''}</div>
                        <div class="pred-title">${pred.name} ${pred.icon}</div>
                        <div class="progress-track">
                            <div class="progress-fill" style="width: ${pred.confidence}%; background: ${isRare ? 'var(--danger)' : 'var(--success)'};"></div>
                        </div>
                        <div class="pred-footer">ثقة: ${pred.confidence}%</div>
                    </div>
                `;
            });
        }

        function startNewRound() {
            if (roundState === 'playing') return;
            if (roundState === 'ended' && !hasRegisteredThisRound) {
                addSystemLog("⚠️ يرجى تسجيل النتيجة بالضغط على المربع أولاً!");
                return;
            }

            const btn = document.getElementById('start-round-btn');
            const mainImg = document.getElementById('main-image');
            const grid = document.getElementById('predictions-grid');
            const analyzingUI = document.getElementById('analyzing-ui');
            
            hasRegisteredThisRound = false;
            roundState = 'playing';
            
            // إخفاء المؤشرات الخمسة
            for(let i=1; i<=5; i++) {
                const m = document.getElementById('marker-'+i);
                if (m) m.style.display = 'none';
            }
            document.querySelectorAll('.sensor').forEach(s => {
                s.classList.remove('active');
                s.classList.remove('selected');
            });
            document.getElementById('registered-area').style.display = 'none';
            
            grid.style.display = 'none';
            analyzingUI.style.display = 'flex';
            mainImg.classList.add('analyzing');
            addSystemLog("🚀 بدء تحليل المحيط...");
            
            btn.disabled = true;
            btn.innerText = "جاري التحليل...";

            setTimeout(() => {
                let predictions = generateSmartPrediction();
                
                analyzingUI.style.display = 'none';
                grid.style.display = 'grid';
                renderPredictions(predictions);

                // عرض المؤشرات الأربعة الأساسية فوراً
                for (let i = 0; i < 4; i++) {
                    let marker = document.getElementById('marker-' + (i + 1));
                    if (marker) {
                        marker.style.top = predictions[i].top;
                        marker.style.left = predictions[i].left;
                        marker.style.display = 'block';
                    }
                }

                mainImg.classList.remove('analyzing');
                addSystemLog("✅ تم استخراج 4 توقعات أساسية");
                
                lastRegisteredId = null; // تصفير التعلم بعد استخدامه
                startActiveRoundTimer();

                // جدولة ظهور المؤشر الخامس والبطاقة الخامسة بعد 3.5 ثواني
                setTimeout(() => {
                    let marker5 = document.getElementById('marker-5');
                    if (marker5) {
                        marker5.style.top = predictions[4].top;
                        marker5.style.left = predictions[4].left;
                        marker5.style.display = 'block';
                    }
                    let card5 = document.getElementById('pred-card-5');
                    if (card5) card5.style.display = 'block';
                    
                    addSystemLog("🔴 ظهر التوقع الخامس (النادر)!");
                }, 3500);

            }, 1500);
        }

        function startActiveRoundTimer() {
            currentRoundTime = 26;
            const btn = document.getElementById('start-round-btn');
            const timerDisplay = document.getElementById('round-timer');
            
            btn.innerText = `الرجاء الانتظار (${currentRoundTime})`;
            timerDisplay.innerText = currentRoundTime;

            if (roundInterval) clearInterval(roundInterval);

            roundInterval = setInterval(() => {
                currentRoundTime--;
                if (currentRoundTime > 0) {
                    btn.innerText = `الرجاء الانتظار (${currentRoundTime})`;
                    timerDisplay.innerText = currentRoundTime;
                } else {
                    clearInterval(roundInterval);
                    timerDisplay.innerText = "0";
                    
                    roundState = 'ended';
                    
                    document.querySelectorAll('.sensor').forEach(s => s.classList.add('active'));
                    
                    btn.innerText = "⏳ يرجى تسجيل النتيجة بالضغط على الصورة";
                    addSystemLog("⏳ انتهت الجولة. اضغط على المربع الذي ظهر لتسجيله.");
                }
            }, 1000);
        }
    </script>
</body>
</html>
