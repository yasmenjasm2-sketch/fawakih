<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة شحن الألعاب والخدمات</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; width: 100%; max-width: 450px; border-radius: 16px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        .title { text-align: center; margin-bottom: 24px; color: #38bdf8; font-size: 24px; font-weight: bold; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        input, select { width: 100%; padding: 12px 16px; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 14px; background-color: #0284c7; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; margin-top: 10px; }
        button:hover { background-color: #0369a1; }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        #result { margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; display: none; }
        .success { background-color: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
        .error { background-color: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; }
        .info { background-color: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid #38bdf8; }
    </style>
</head>
<body>

<div class="card">
    <div class="title">شحن خدمات الألعاب</div>
    <form id="chargeForm">
        <div class="form-group">
            <label for="playerId">رقم المعرف / الحساب (ID):</label>
            <input type="text" id="playerId" required placeholder="أدخل رقم الـ ID أو اسم الحساب">
        </div>

        <div class="form-group">
            <label for="serviceId">اختر الخدمة:</label>
            <select id="serviceId" required>
                <option value="">جاري تحميل الخدمات...</option>
            </select>
        </div>

        <button type="submit" id="submitBtn">إرسال طلب الشحن</button>
    </form>
    <div id="result"></div>
</div>

<script>
    const form = document.getElementById('chargeForm');
    const submitBtn = document.getElementById('submitBtn');
    const resultDiv = document.getElementById('result');
    const serviceSelect = document.getElementById('serviceId');

    // جلب قائمة الخدمات المتاحة فور تحميل الصفحة
    async function fetchServices() {
        try {
            const res = await fetch('api_handler.php?action=get_services');
            const data = await res.json();
            
            if (data.status && Array.isArray(data.services)) {
                serviceSelect.innerHTML = '<option value="">-- اختر الخدمة --</option>';
                data.services.forEach(service => {
                    const option = document.createElement('option');
                    option.value = service.id;
                    option.textContent = `${service.name} - ${service.price || ''}`;
                    serviceSelect.appendChild(option);
                });
            } else {
                // خيارات افتراضية في حال عدم استجابة الـ API
                serviceSelect.innerHTML = `
                    <option value="">-- اختر الخدمة --</option>
                    <option value="1">ببجي 60 شدة</option>
                    <option value="2">ببجي 325 شدة</option>
                    <option value="3">فراي فاير 100 مجوهرة</option>
                `;
            }
        } catch (e) {
            serviceSelect.innerHTML = `
                <option value="">-- اختر الخدمة --</option>
                <option value="1">ببجي 60 شدة</option>
                <option value="2">ببجي 325 شدة</option>
            `;
        }
    }

    fetchServices();

    // إرسال الطلب
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const playerId = document.getElementById('playerId').value.trim();
        const serviceId = serviceSelect.value;
        
        if (!serviceId) {
            showResult("يرجى اختيار الخدمة أولاً", "error");
            return;
        }

        submitBtn.disabled = true;
        showResult("جاري معالجة الطلب والإرسال للسيرفر...", "info");

        try {
            const response = await fetch('api_handler.php?action=create_order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    player_id: playerId,
                    service_id: serviceId
                })
            });

            const data = await response.json();

            if (response.ok && data.status) {
                showResult(`تم تنفيذ الطلب بنجاح! رقم الطلب: ${data.order_id || 'مكتمل'}`, "success");
                form.reset();
            } else {
                showResult(`خطأ: ${data.message || 'فشل في تنفيذ الطلب'}`, "error");
            }
        } catch (error) {
            showResult("حدث خطأ في الاتصال بالسيرفر المحلي.", "error");
        } finally {
            submitBtn.disabled = false;
        }
    });

    function showResult(msg, type) {
        resultDiv.style.display = "block";
        resultDiv.className = type;
        resultDiv.innerText = msg;
    }
</script>

</body>
</html>
