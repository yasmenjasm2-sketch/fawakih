<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YALLA FRUIT v7.0 - NEXUS HYBRID ENGINE</title>
    
    <!-- Firebase SDK (Version 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- استدعاء العقل الرئيسي (الخوارزمية) من الملف المستقل -->
    <script src="fruitsystm.js"></script>

    <style>
        :root {
            --bg-main: #0B0612;
            --bg-panel: #130922;
            --bg-card: #180C2B;
            --primary: #9D4EDD;
            --primary-dark: #5A189A;
            --gold: #F8C000;
            --neon-blue: #00E5FF;
            --success: #00E676;
            --danger: #FF4757;
            --text-main: #FFFFFF;
            --text-muted: #8A7A9E;
            --border-color: #2D1B4E;
            --glass-bg: rgba(19, 9, 34, 0.75);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* خلفية متحركة تعتمد على التلاشي التدريجي (Enter Fade 2000ms / Exit 4000ms) */
        @keyframes animationDrawableFade {
            0% {
                background-color: #0B0612;
                background-image: radial-gradient(circle at 50% 30%, rgba(0, 229, 255, 0.12) 0%, transparent 70%),
                                  linear-gradient(135deg, #09040d, #1a0b2e, #0d0616, #210d3b);
            }
            33% {
                background-color: #130922;
                background-image: radial-gradient(circle at 30% 70%, rgba(157, 78, 221, 0.2) 0%, transparent 70%),
                                  linear-gradient(135deg, #120624, #0b0318, #1a0b2e, #09040d);
            }
            66% {
                background-color: #180C2B;
                background-image: radial-gradient(circle at 70% 40%, rgba(0, 230, 118, 0.15) 0%, transparent 70%),
                                  linear-gradient(135deg, #1b0a33, #110524, #080210, #180C2B);
            }
            100% {
                background-color: #0B0612;
                background-image: radial-gradient(circle at 50% 30%, rgba(0, 229, 255, 0.12) 0%, transparent 70%),
                                  linear-gradient(135deg, #09040d, #1a0b2e, #0d0616, #210d3b);
            }
        }

        @keyframes glowPulse {
            0% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
            100% { opacity: 0.3; transform: scale(1); }
        }

        body {
            background-size: 300% 300%;
            animation: animationDrawableFade 6s ease-in-out infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
            transition: background 2s ease-in-out;
        }

        /* تأثير التوهج النيون البنفسجي والأزرق */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.15) 0%, rgba(157, 78, 221, 0.1) 40%, transparent 70%);
            animation: glowPulse 10s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }

        /* قسم المبرمج */
        #dev-logo {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--neon-blue);
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 0 12px var(--neon-blue);
            transition: transform 0.2s ease;
        }
        #dev-logo:active {
            transform: scale(1.2);
        }

        #dev-info {
            position: absolute;
            top: 65px;
            right: 15px;
            background: var(--glass-bg);
            border: 1px solid var(--neon-blue);
            padding: 10px 15px;
            border-radius: 12px;
            text-align: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
        }
        #dev-info.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .dev-name { color: var(--gold); font-size: 14px; font-weight: bold; }
        .dev-sub { color: var(--neon-blue); font-size: 12px; }

        /* شاشة النظام الرئيسية */
        #game-screen {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 480px;
            gap: 15px;
        }

        /* الهيدر العلوي */
        .app-header {
            text-align: center;
            margin-bottom: 5px;
            margin-top: 40px;
        }
        .app-header h1 {
            font-size: 24px;
            font-weight: 900;
            color: var(--gold);
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(248, 192, 0, 0.5);
        }
        .app-header h1 span { color: var(--danger); font-size: 18px; }

        /* شريط الإحصائيات ذو التوهج الأزرق النيون */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: var(--glass-bg);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            padding: 12px 15px;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
        }
        .stats-bar span { display: flex; align-items: center; gap: 5px; }
        .stat-value { color: var(--neon-blue); text-shadow: 0 0 8px var(--neon-blue); }
        .stat-icon { color: var(--gold); }

        /* الصورة في الأعلى ومكبرة */
        .game-container {
            position: relative;
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid var(--primary);
            box-shadow: 0 0 25px rgba(157, 78, 221, 0.4);
            margin-bottom: 10px;
        }
        .game-image {
            display: block;
            width: 100%;
            height: auto;
            opacity: 0.9;
            transition: opacity 0.3s;
        }
        .game-image.analyzing { opacity: 0.4; filter: blur(3px); }
        
        .marker {
            position: absolute;
            font-size: 26px;
            transform: translate(-50%, -50%);
            display: none;
            filter: drop-shadow(0px 0px 10px rgba(0, 230, 118, 1));
            z-index: 10;
        }

        /* حقل الإدخال الجديد وزر بدء الجولة التدرجي */
        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }
        
        .modern-input {
            width: 100%;
            padding: 16px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #3B0A75;
            border-radius: 30px;
            color: white;
            text-align: center;
            font-size: 16px;
            outline: none;
            transition: border 0.3s ease, box-shadow 0.3s ease;
        }
        .modern-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
        }

        .start-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00E676, #00B0FF, #F8C000);
            background-size: 200% 200%;
            color: #000;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 230, 118, 0.4), 0 0 10px rgba(248, 192, 0, 0.3);
            transition: all 0.2s ease-in-out;
        }
        .start-btn:active {
            transform: scale(1.2);
        }
        .start-btn:disabled {
            background: #2D1B4E;
            color: #8A7A9E;
            box-shadow: none;
            cursor: not-allowed;
            transform: scale(1);
        }

        /* الحاويات (Panels) */
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 15px;
            position: relative;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: bold;
            color: var(--primary);
        }
        
        /* التوقعات (Cards) */
        .predictions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .pred-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            position: relative;
            transition: transform 0.2s ease, border-color 0.3s;
            cursor: pointer;
        }
        .pred-card:active {
            transform: scale(1.2);
        }
        .pred-card.active-card {
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(248, 192, 0, 0.2);
        }
        .pred-type { font-size: 10px; color: var(--text-muted); text-align: right; margin-bottom: 5px; }
        .pred-title { font-size: 18px; font-weight: bold; color: white; text-align: center; margin-bottom: 5px; }
        .pred-score { font-size: 11px; color: var(--text-muted); text-align: center; margin-bottom: 8px; }
        .progress-track { width: 100%; height: 4px; background: #25163D; border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
        .progress-fill { height: 100%; background: var(--success); width: 0%; transition: width 1s ease-in-out; }
        .pred-footer { font-size: 10px; color: var(--text-muted); text-align: center; }

        /* سجل النظام (Terminal) */
        .system-log {
            background: #060309;
            border: 1px solid #1E1035;
            border-radius: 8px;
            padding: 10px;
            height: 120px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            color: #A093B5;
            line-height: 1.6;
            direction: ltr;
            text-align: left;
        }
        .log-time { color: var(--text-muted); }
        .log-highlight { color: var(--success); }

        /* شريط التحليل (متحرك) */
        .analyzing-bar {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            color: var(--primary);
            font-weight: bold;
            font-size: 14px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; text-shadow: 0 0 10px var(--primary); }
            100% { opacity: 0.6; }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #060309; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }
    </style>
</head>
<body>

    <!-- WebView مخفي في الخلفية استقبال الأوامر التلقائية -->
    <iframe id="hidden-webview-receiver" style="display:none; width:0; height:0;" src="about:blank"></iframe>

    <img src="hamza.jpg" id="dev-logo" alt="Developer" onclick="showDevInfo()">
    <div id="dev-info">
        <div class="dev-name">hamza elhumada</div>
        <div class="dev-sub">nbras</div>
    </div>

    <!-- شاشة النظام الرئيسية -->
    <div id="game-screen">
        
        <div class="app-header">
            <h1>🍒 YALLA FRUIT <span>v7.0</span></h1>
        </div>

        <!-- الصورة في الأعلى ومكبرة -->
        <div class="game-container">
            <div id="img-wrap" style="position: relative;">
                <img src="fefaf.jpg" alt="Fruit Party" class="game-image" id="main-image">
                <div id="marker-1" class="marker">✅</div>
                <div id="marker-2" class="marker">✅</div>
                <div id="marker-3" class="marker">✅</div>
                <div id="marker-4" class="marker">✅</div>
            </div>
        </div>

        <!-- شريط الإحصائيات -->
        <div class="stats-bar">
            <span><span class="stat-icon">📊</span> جولة: <span class="stat-value" id="round-timer">0</span></span>
            <span><span class="stat-icon">👤</span> <span class="stat-value" id="online-count">0</span></span>
            <span>HYBRID 🟣🟢</span>
        </div>

        <!-- حقل الإدخال وزر البدء الجديد -->
        <div class="controls-container">
            <input type="text" id="fruit-training-input" class="modern-input" placeholder="أدخل اسم الفاكهة الصحيح هنا">
            <button id="start-round-btn" class="start-btn" onclick="startNewRound()">بدء جولة جديدة 🚀</button>
        </div>

        <!-- التوقعات -->
        <div class="panel">
            <div class="panel-header">
                <span>🎯 توقعات NEXUS</span>
                <span style="color: var(--gold); font-size: 10px;">CODEX v7.0</span>
            </div>
            <div class="analyzing-bar" id="analyzing-ui">
                جاري التحليل... 🧠
            </div>
            <div class="predictions-grid" id="predictions-grid">
                <div style="grid-column: span 2; text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px;">
                    اضغط "بدء جولة جديدة" لاستخراج التوقعات
                </div>
            </div>
        </div>

        <!-- سجل النظام -->
        <div class="panel">
            <div class="panel-header">
                <span>📋 سجل النظام</span>
            </div>
            <div class="system-log" id="system-log">
                <div><span class="log-time">[نظام]</span> 🍒 YALLA FRUIT v7.0 - جاهز للعمل</div>
            </div>
        </div>

    </div>

    <script>
        function showDevInfo() {
            const infoBox = document.getElementById('dev-info');
            infoBox.classList.add('show');
            setTimeout(() => { infoBox.classList.remove('show'); }, 3000); 
        }

        const firebaseConfig = {
            apiKey: "AIzaSyAo4IaLd5SfVYHAAp_noJD7ZXBbhdVx9-0",
            databaseURL: "https://fawakihyallalive-default-rtdb.firebaseio.com",
            projectId: "fawakihyallalive",
            storageBucket: "fawakihyallalive.firebasestorage.app",
            appId: "1:917478913649:android:fee5d42aca81c8a2e3cdd0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const slots = [
            { id: 1, top: '17%', left: '17%' }, // برتقال
            { id: 2, top: '17%', left: '50%' }, // ليمون
            { id: 3, top: '17%', left: '83%' }, // عنب
            { id: 4, top: '50%', left: '17%' }, // كرز
            { id: 5, top: '50%', left: '83%' }, // تفاح
            { id: 6, top: '83%', left: '17%' }, // بطيخ
            { id: 7, top: '83%', left: '50%' }, // مانجو
            { id: 8, top: '83%', left: '83%' }  // فراولة
        ];

        const fruitData = {
            1: { name: 'برتقال', icon: '🍊', mult: 'x5', type: 'SMALL' },
            2: { name: 'ليمون', icon: '🍋', mult: 'x5', type: 'SMALL' },
            3: { name: 'عنب', icon: '🍇', mult: 'x5', type: 'SMALL' },
            4: { name: 'كرز', icon: '🍒', mult: 'x45', type: 'BIG' },
            5: { name: 'تفاح', icon: '🍎', mult: 'x5', type: 'SMALL' },
            6: { name: 'بطيخ', icon: '🍉', mult: 'x25', type: 'BIG' },
            7: { name: 'مانجو', icon: '🥭', mult: 'x15', type: 'BIG' },
            8: { name: 'فراولة', icon: '🍓', mult: 'x10', type: 'BIG' }
        };

        let currentRoundTime = 35; 
        let roundInterval;
        let isGuessingAllowed = true;
        let previousSelection = [];

        function isAppWebView() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            return (ua.indexOf('Android') > -1 && ua.indexOf('wv') > -1) || /(iPhone|iPod|iPad).*AppleWebKit(?!.*Safari)/i.test(ua);
        }

        window.onload = function() {
            // التحقق من حالة تسجيل الدخول أولاً
            if (isAppWebView() || localStorage.getItem('is_vip_logged_in') === 'true') {
                showGame(); // فتح الشاشة إذا كان مسجلاً للدخول
            } else {
                // إذا لم يكن مسجلاً للدخول، يتم استدعاء ملف free.html كواجهة دخول
                window.location.href = 'free.html';
            }
        };

        function showGame() {
            document.getElementById('game-screen').style.display = 'flex';
            updateLiveStats(true);
        }

        function addSystemLog(msg, isHighlight = false) {
            const logBox = document.getElementById('system-log');
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            const highlightClass = isHighlight ? 'log-highlight' : '';
            logBox.innerHTML += `<div><span class="log-time">[${time}]</span> <span class="${highlightClass}">${msg}</span></div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function renderPredictions(selectedSlots) {
            const grid = document.getElementById('predictions-grid');
            grid.innerHTML = '';
            selectedSlots.forEach((slot, index) => {
                const fData = fruitData[slot.id];
                const confidence = Math.floor(Math.random() * (99 - 95 + 1)) + 95;
                const score = (Math.random() * 2000 + 300).toFixed(1);
                const minority = (Math.random() * 8 + 0.5).toFixed(1);
                const barColor = confidence >= 97 ? 'var(--success)' : 'var(--gold)';
                const activeClass = index === 0 ? 'active-card' : '';
                const typeLabel = fData.type === 'BIG' ? `${fData.type} 🔴` : `${fData.type} 🟢`;

                grid.innerHTML += `
                    <div class="pred-card ${activeClass}">
                        <div class="pred-type">${typeLabel}</div>
                        <div class="pred-title">${fData.name} ${fData.mult} ${fData.icon}</div>
                        <div class="pred-score">Score: ${score} | <span>%${confidence} ثقة</span></div>
                        <div class="progress-track">
                            <div class="progress-fill" style="width: ${confidence}%; background: ${barColor};"></div>
                        </div>
                        <div class="pred-footer">رهان: ${minority}% | أقلية 🟢</div>
                    </div>
                `;
            });
        }

        function startNewRound() {
            if (!isGuessingAllowed) return;

            const inputField = document.getElementById('fruit-training-input');
            const fruitValue = inputField.value.trim();

            // إرسال الاسم للخوارزمية إذا وجد
            if(fruitValue !== "") {
                if(typeof trainAlgorithm === 'function') {
                    const trained = trainAlgorithm(fruitValue);
                    if(trained) {
                        addSystemLog(`✅ تم إرسال [${fruitValue}] لتغذية ذاكرة الخوارزمية`, true);
                    } else {
                        addSystemLog(`⚠️ اسم غير معروف: [${fruitValue}] - تم التجاهل`, false);
                    }
                }
                inputField.value = ""; // تفريغ الحقل
            }

            // تشغيل المحرك
            const mainImg = document.getElementById('main-image');
            const btn = document.getElementById('start-round-btn');
            const grid = document.getElementById('predictions-grid');
            const analyzingUI = document.getElementById('analyzing-ui');
            
            for(let i=1; i<=4; i++) document.getElementById('marker-'+i).style.display = 'none';
            grid.style.display = 'none';
            analyzingUI.style.display = 'flex';
            mainImg.classList.add('analyzing');

            addSystemLog("🚀 NEXUS بدء محرك...", true);
            
            btn.disabled = true;
            btn.innerText = "جاري التحليل...";
            isGuessingAllowed = false;

            setTimeout(() => {
                let selectedSlots = generatePrediction(slots, previousSelection);
                
                if (!selectedSlots || selectedSlots.length === 0) {
                    addSystemLog("❌ فشل المحرك", false);
                    resetEngineUI();
                    return;
                }

                previousSelection = selectedSlots.map(s => s.id);
                
                analyzingUI.style.display = 'none';
                grid.style.display = 'grid';
                renderPredictions(selectedSlots);

                selectedSlots.forEach((slot, index) => {
                    let marker = document.getElementById('marker-' + (index + 1));
                    marker.style.top = slot.top;
                    marker.style.left = slot.left;
                    marker.style.display = 'block';
                });

                mainImg.classList.remove('analyzing');
                addSystemLog("✅ تم استخراج التوقعات بنجاح", true);
                
                startActiveRoundTimer();
            }, 1500);
        }

        function resetEngineUI() {
            const btn = document.getElementById('start-round-btn');
            btn.disabled = false;
            btn.innerText = "بدء جولة جديدة 🚀";
            document.getElementById('main-image').classList.remove('analyzing');
            document.getElementById('analyzing-ui').style.display = 'none';
            document.getElementById('predictions-grid').style.display = 'grid';
            isGuessingAllowed = true;
        }

        function startActiveRoundTimer() {
            currentRoundTime = 35; 
            const btn = document.getElementById('start-round-btn');
            const timerDisplay = document.getElementById('round-timer');
            
            btn.innerText = `الرجاء الانتظار (${currentRoundTime})`;
            timerDisplay.innerText = currentRoundTime;

            if (roundInterval) clearInterval(roundInterval);

            roundInterval = setInterval(() => {
                currentRoundTime--;
                if (currentRoundTime > 0) {
                    btn.innerText = `الرجاء الانتظار (${currentRoundTime})`;
                    timerDisplay.innerText = currentRoundTime;
                    updateLiveStats(false);
                } else {
                    clearInterval(roundInterval);
                    timerDisplay.innerText = "0";
                    addSystemLog("⏳ انتهت الجولة. يمكن بدء جولة جديدة الآن.");
                    resetEngineUI();
                }
            }, 1000);
        }

        function updateLiveStats(isReset) {
            if (isReset) {
                document.getElementById('online-count').innerText = "0";
            } else {
                let grandTotalOnline = Math.floor(Math.random() * 500) + 100;
                document.getElementById('online-count').innerText = grandTotalOnline;
            }
        }
    </script>
</body>
</html>
