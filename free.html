<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول وتفعيل الاشتراك</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-main: #130a21;
            --container-bg: #22153b;
            --primary-purple: #a67cff;
            --btn-purple: #9d6cff;
            --btn-dark: #2a1f43;
            --text-main: #FFFFFF;
            --text-muted: #a093b5;
            --green-whatsapp: #25D366;
            --blue-buy: #3498db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .auth-container {
            display: none;
            flex-direction: column;
            align-items: center;
            background: var(--container-bg);
            padding: 40px 25px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 380px;
            text-align: center;
            position: relative;
        }

        .auth-container.active {
            display: flex;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* تنسيق زر جوجل الأنيق */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            color: #333;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            margin-top: 20px;
        }
        .google-btn:active { transform: scale(0.96); }
        .google-btn svg { width: 24px; height: 24px; }

        /* أيقونة الدرع */
        .shield-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #c4a1ff, #8b5cf6);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        h2 { color: var(--text-main); font-size: 22px; margin-bottom: 10px; font-weight: 700; }
        p { color: var(--text-muted); font-size: 13px; margin-bottom: 25px; }

        /* حقل إدخال الكود */
        .input-group {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            background: #1a0f2e;
            border: 1px solid #3d2b5e;
            padding: 16px 20px;
            padding-left: 80px; /* مساحة لزر اللصق */
            border-radius: 15px;
            color: white;
            font-size: 15px;
            outline: none;
            text-align: right;
            direction: rtl;
        }

        .input-group input::placeholder { color: #6b5c85; }

        .paste-btn {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: #2a1f43;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }
        .paste-btn:hover { background: #3d2b5e; }

        /* زر الدخول الآمن */
        .secure-login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #a67cff, #8b5cf6);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.3);
            margin-bottom: 20px;
            transition: opacity 0.2s;
        }
        .secure-login-btn:active { opacity: 0.8; }

        /* أزرار الدعم والشراء */
        .action-buttons {
            display: flex;
            gap: 15px;
            width: 100%;
            margin-bottom: 25px;
        }

        .action-btn {
            flex: 1;
            padding: 14px 10px;
            background: var(--btn-dark);
            border: none;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: white;
            transition: background 0.2s;
        }
        .action-btn:hover { background: #352754; }

        .btn-whatsapp { color: var(--green-whatsapp); }
        .btn-buy { color: var(--blue-buy); }

        /* الروابط السفلية */
        .footer-links {
            display: flex;
            gap: 15px;
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 25px;
        }
        .footer-links span { cursor: pointer; }
        .footer-links span:hover { color: white; }

        /* المعرف (Device ID) */
        .device-id-container {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 10px;
            background: rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .device-id-container:hover { background: rgba(0,0,0,0.4); color: white; }

        svg { fill: currentColor; width: 16px; height: 16px; }

    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول بواسطة جوجل -->
    <div id="login-screen" class="auth-container active">
        <div style="margin-bottom: 20px;">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z" fill="#9D4EDD"/>
            </svg>
        </div>
        <h2>تسجيل الدخول</h2>
        <p>قم بتسجيل الدخول للوصول إلى محرك الألعاب</p>
        
        <button class="google-btn" onclick="signInWithGoogle()">
            <svg viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
            </svg>
            تسجيل الدخول بـ Google
        </button>
    </div>

    <!-- شاشة تفعيل الاشتراك (التصميم المطابق للصورة) -->
    <div id="activation-screen" class="auth-container">
        
        <!-- أيقونة الدرع -->
        <div class="shield-icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="white">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
            </svg>
        </div>

        <h2>تفعيل الاشتراك</h2>
        <p>يرجى إدخال أو لصق كود التفعيل الخاص بك</p>

        <!-- حقل الإدخال -->
        <div class="input-group">
            <button class="paste-btn" onclick="pasteCode()">
                لصق
                <svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>
            </button>
            <input type="text" id="activation-code" placeholder="أدخل الكود هنا . . .">
        </div>

        <!-- زر الدخول -->
        <button class="secure-login-btn" onclick="verifyAndEnterGame()">دخول آمن</button>

        <!-- أزرار الدعم والشراء -->
        <div class="action-buttons">
            <button class="action-btn btn-buy" onclick="window.open('https://yasmenjasm2-sketch.github.io/update.json/payment.html', '_blank')">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.67v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h1.96c.1 1.05.82 1.87 2.65 1.87 1.96 0 2.4-.98 2.4-1.59 0-.83-.44-1.61-2.67-2.14-2.48-.6-4.18-1.62-4.18-3.67 0-1.72 1.39-2.84 3.11-3.21V4h2.67v1.95c1.86.45 2.79 1.86 2.85 3.39H14.3c-.05-1.11-.64-1.87-2.22-1.87-1.5 0-2.4.68-2.4 1.64 0 .84.65 1.39 2.67 1.91s4.18 1.39 4.18 3.91c-.01 1.83-1.38 2.83-3.12 3.16z"/></svg>
                شراء اشتراك
            </button>

            <button class="action-btn btn-whatsapp" onclick="window.open('https://wa.me/905424678123', '_blank')">
                <svg viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91s-4.45-9.91-9.91-9.91zm5.44 14.21c-.23.64-1.33 1.24-1.84 1.32-.46.07-1.04.14-3.15-.74-2.58-1.07-4.24-3.72-4.37-3.89-.13-.18-1.04-1.39-1.04-2.66 0-1.27.66-1.89.89-2.14.23-.25.51-.31.68-.31s.34.01.49.02c.16.01.37-.06.57.42.21.49.72 1.76.79 1.89.06.13.11.28.02.46-.08.18-.13.29-.25.44-.13.14-.26.32-.38.44-.13.13-.27.27-.12.52.14.26.64 1.07 1.38 1.73.95.84 1.74 1.1 1.99 1.23.25.13.4.11.55-.06.14-.18.61-.71.77-.96.16-.25.32-.21.55-.13.23.08 1.48.7 1.74.83.25.13.42.19.48.29.06.11.06.63-.17 1.27z"/></svg>
                الدعم الفني
            </button>
        </div>

        <!-- روابط أسفل الصفحة -->
        <div class="footer-links">
            <span>سياسة الخصوصية</span>
            <span>•</span>
            <span>طريقة الاستخدام</span>
        </div>

        <!-- المعرف الخاص بالجهاز -->
        <div class="device-id-container" onclick="copyDeviceID()" title="انقر لنسخ المعرف">
            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            <span id="display-device-id">DEVICE ID: جاري التوليد...</span>
        </div>

    </div>

    <script>
        // إعدادات قاعدة البيانات (كما أرسلتها)
        const firebaseConfig = {
            apiKey: "AIzaSyDr0kbQDE90hhEMohV6X1b4ndu4L7uZz24",
            authDomain: "mehamzaalanat.firebaseapp.com",
            databaseURL: "https://mehamzaalanat-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "mehamzaalanat",
            storageBucket: "mehamzaalanat.firebasestorage.app",
            appId: "1:10248497310:android:bc2b88983738827f15338f"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // 1. توليد أو جلب معرف الجهاز (9 أرقام)
        let deviceID = localStorage.getItem('game_device_id');
        if (!deviceID) {
            deviceID = Math.floor(100000000 + Math.random() * 900000000).toString();
            localStorage.setItem('game_device_id', deviceID);
        }
        document.getElementById('display-device-id').innerText = `DEVICE ID: ${deviceID}`;

        // 2. مراقبة حالة تسجيل الدخول تلقائياً
        auth.onAuthStateChanged((user) => {
            if (user) {
                // إذا تم تسجيل الدخول بجوجل، أظهر شاشة تفعيل الاشتراك
                document.getElementById('login-screen').classList.remove('active');
                document.getElementById('activation-screen').classList.add('active');
            } else {
                // شاشة تسجيل الدخول
                document.getElementById('login-screen').classList.add('active');
                document.getElementById('activation-screen').classList.remove('active');
            }
        });

        // 3. دالة تسجيل الدخول بجوجل
        function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then((result) => {
                const user = result.user;
                // حفظ بيانات المستخدم
                db.ref('users/' + user.uid).set({
                    name: user.displayName,
                    email: user.email,
                    deviceID: deviceID, // ربط حساب جوجل بمعرف الجهاز
                    lastLogin: new Date().toISOString()
                });
            }).catch((error) => {
                alert("حدث خطأ أثناء تسجيل الدخول: " + error.message);
            });
        }

        // 4. دالة نسخ معرف الجهاز
        function copyDeviceID() {
            navigator.clipboard.writeText(deviceID).then(() => {
                alert("تم نسخ معرف الجهاز بنجاح: " + deviceID);
            }).catch(err => {
                console.error('فشل النسخ: ', err);
            });
        }

        // 5. دالة لصق الكود
        function pasteCode() {
            navigator.clipboard.readText().then(text => {
                document.getElementById('activation-code').value = text;
            }).catch(err => {
                alert('يرجى السماح بصلاحية اللصق في المتصفح');
            });
        }

        // 6. التحقق من الكود والدخول للعبة (index.html)
        function verifyAndEnterGame() {
            const code = document.getElementById('activation-code').value.trim();
            
            // يمكنك هنا ربط الكود بقاعدة البيانات للتحقق إذا كان الاشتراك مفعل أم لا
            // هذا شرط بسيط كـ مثال للتأكد أنه أدخل كود من 9 أرقام:
            if(code.length === 9 && !isNaN(code)) {
                // إذا الكود صحيح ومفعل
                window.location.href = 'index.html';
            } else {
                alert("الكود غير صحيح أو الاشتراك غير مفعل. يرجى شراء اشتراك أو مراسلة الدعم.");
            }
        }
    </script>
</body>
</html>
