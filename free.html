<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - YALLA FRUIT</title>
    
    <!-- Firebase SDK (Version 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #120a1f;
            --card-bg: #1e1335;
            --border-color: #312352;
            --primary-btn: linear-gradient(90deg, #a46cff, #8b48f9);
            --text-main: #ffffff;
            --text-sub: #9b8eb3;
            --wa-color: #34d399;
            --buy-color: #60a5fa;
            --btn-secondary-bg: #22173a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* حاوية الشاشات */
        .auth-container {
            display: none;
            flex-direction: column;
            align-items: center;
            background: var(--card-bg);
            padding: 40px 30px 25px;
            border-radius: 25px;
            border: 1px solid var(--border-color);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            width: 90%;
            max-width: 380px;
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }

        .auth-container.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* الأيقونة العلوية (الدرع) */
        .shield-icon-container {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #c3a1ff, #9968f5);
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(153, 104, 245, 0.4);
        }

        h2 { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        p { color: var(--text-sub); font-size: 14px; margin-bottom: 30px; line-height: 1.5; }

        /* زر جوجل */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            background: #ffffff;
            color: #3c4043;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }
        .google-btn:active { transform: scale(0.97); }

        /* زر الدخول للعبة */
        .main-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary-btn);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(139, 72, 249, 0.4);
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }
        .main-btn:active { transform: scale(0.97); }

        /* أزرار الدعم والشراء */
        .action-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 30px;
        }

        .action-btn {
            flex: 1;
            background: var(--btn-secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .action-btn:active { transform: scale(0.95); }
        
        .wa-btn { color: var(--wa-color); }
        .buy-btn { color: var(--buy-color); }

        /* الروابط السفلية */
        .footer-links {
            color: #7d6b9e;
            font-size: 13px;
            margin-bottom: 25px;
        }

        /* معرف الجهاز */
        .device-id-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #8b7ca6;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            padding: 8px 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            transition: background 0.2s;
        }
        .device-id-container:hover { background: rgba(255,255,255,0.08); }
        .device-id-container span { font-weight: bold; color: #bca4ea; }

        /* رسائل التنبيه (Toast) */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #e74c3c;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1;
            top: 30px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: opacity 0.3s, top 0.3s;
            opacity: 0;
        }
        #toast.show { visibility: visible; opacity: 1; top: 50px; }
        #toast.success { background-color: #2ecc71; }

    </style>
</head>
<body>

    <div id="toast">رسالة التنبيه هنا</div>

    <!-- شاشة تسجيل الدخول بواسطة جوجل -->
    <div id="login-screen" class="auth-container active">
        <div class="shield-icon-container">
            <!-- أيقونة الدرع -->
            <svg viewBox="0 0 24 24" width="35" height="35" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
        </div>
        <h2>تسجيل الدخول</h2>
        <p>يرجى تسجيل الدخول بحساب Google للوصول إلى النظام وإنشاء معرف خاص بك.</p>
        
        <button class="google-btn" onclick="signInWithGoogle()">
            <!-- شعار جوجل مرسوم برمجيا بألوانه -->
            <svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            تسجيل الدخول بـ Google
        </button>

        <div class="footer-links">
            سياسة الخصوصية &nbsp; • &nbsp; طريقة الاستخدام
        </div>
    </div>

    <!-- شاشة تفعيل الاشتراك -->
    <div id="activation-screen" class="auth-container">
        <div class="shield-icon-container">
            <svg viewBox="0 0 24 24" width="35" height="35" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                <path d="M9 12l2 2 4-4"></path> <!-- علامة الصح داخل الدرع -->
            </svg>
        </div>
        
        <h2>تفعيل الاشتراك</h2>
        <p>يرجى شراء اشتراك وتفعيله للتمكن من الدخول إلى اللعبة.</p>

        <button class="main-btn" onclick="checkSubscriptionAndEnter()">دخول آمن</button>

        <div class="action-buttons">
            <!-- زر الدعم الفني (واتساب) -->
            <a href="#" id="wa-link" class="action-btn wa-btn" target="_blank">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                </svg>
                الدعم الفني
            </a>
            
            <!-- زر شراء الاشتراك -->
            <a href="https://yasmenjasm2-sketch.github.io/update.json/payment.html" class="action-btn buy-btn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M2 7a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7zm2 2v2h16V9H4zm0 4v2h16v-2H4z"/>
                </svg>
                شراء اشتراك
            </a>
        </div>

        <div class="footer-links">
            سياسة الخصوصية &nbsp; • &nbsp; طريقة الاستخدام
        </div>

        <!-- عرض ونسخ معرف الجهاز -->
        <div class="device-id-container" onclick="copyDeviceId()">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M16 1H4C2.9 1 2 1.9 2 3v14h2V3h12V1zm3 4H8C6.9 4 6 4.9 6 6v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H8V6h11v14z"/>
            </svg>
            DEVICE ID: <span id="device-id-text">---------</span>
        </div>
    </div>

    <script>
        // إعدادات قاعدة البيانات الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyDr0kbQDE90hhEMohV6X1b4ndu4L7uZz24",
            authDomain: "mehamzaalanat.firebaseapp.com",
            databaseURL: "https://mehamzaalanat-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "mehamzaalanat",
            storageBucket: "mehamzaalanat.firebasestorage.app",
            appId: "1:10248497310:android:bc2b88983738827f15338f"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // التبديل بين الشاشات
        function showScreen(screenId) {
            document.querySelectorAll('.auth-container').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // توليد معرف جهاز ثابت من 9 أرقام
        function generateDeviceId() {
            return Math.floor(100000000 + Math.random() * 900000000).toString();
        }

        // مراقبة حالة تسجيل الدخول
        auth.onAuthStateChanged((user) => {
            if (user) {
                const userRef = db.ref('users/' + user.uid);
                
                userRef.once('value').then((snapshot) => {
                    let userData = snapshot.val();
                    
                    // إذا لم يكن لدى المستخدم حساب مسبق (أول مرة يسجل)
                    if (!userData || !userData.deviceId) {
                        const newId = generateDeviceId();
                        userData = {
                            name: user.displayName,
                            email: user.email,
                            deviceId: newId,
                            isSubscribed: false, // يجب أن يتم تحويلها لـ true من قبلك بعد الدفع
                            lastLogin: new Date().toISOString()
                        };
                        userRef.set(userData);
                    } else {
                        // تحديث وقت آخر دخول
                        userRef.update({ lastLogin: new Date().toISOString() });
                    }

                    // تحديث الشاشة بالبيانات
                    document.getElementById('device-id-text').innerText = userData.deviceId;
                    
                    // إعداد رابط الواتساب مع رسالة جاهزة تتضمن رقم المعرف
                    const waMessage = encodeURIComponent(`مرحباً، أريد تفعيل اشتراكي. معرف الجهاز الخاص بي هو: ${userData.deviceId}`);
                    document.getElementById('wa-link').href = `https://wa.me/905424678123?text=${waMessage}`;
                    
                    showScreen('activation-screen');
                });
            } else {
                showScreen('login-screen');
            }
        });

        // التقاط أي أخطاء عند العودة من إعادة التوجيه
        auth.getRedirectResult().catch((error) => {
            if(error) {
                showToast("خطأ من جوجل: " + error.message, false);
            }
        });

        // تسجيل الدخول
        function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            // تم التغيير لـ Redirect لتفادي حظر النوافذ المنبثقة داخل الـ iframe أو الموبايل
            auth.signInWithRedirect(provider).catch((error) => {
                showToast("حدث خطأ أثناء الاتصال: " + error.message, false);
            });
        }

        // فحص الاشتراك ودخول اللعبة
        function checkSubscriptionAndEnter() {
            const user = auth.currentUser;
            if (user) {
                db.ref('users/' + user.uid + '/isSubscribed').once('value').then((snapshot) => {
                    if (snapshot.val() === true) {
                        // بدلاً من window.location التي تفتح اللعبة داخل المربع الصغير
                        // نرسل إشارة للصفحة الأم لإخفاء الـ iframe وفتح اللعبة بشكل صحيح
                        window.parent.postMessage('login_success', '*');
                        
                        // كخيار احتياطي إذا كان الملف مفتوح بشكل مباشر
                        if (window.top === window.self) {
                            window.location.href = 'index.html';
                        }
                    } else {
                        showToast("حسابك غير مفعل! يرجى شراء اشتراك أولاً.", false);
                    }
                });
            }
        }

        // نسخ معرف الجهاز
        function copyDeviceId() {
            const did = document.getElementById('device-id-text').innerText;
            if(did && did !== "---------") {
                navigator.clipboard.writeText(did).then(() => {
                    showToast("تم نسخ معرف الجهاز بنجاح!", true);
                });
            }
        }

        // نظام التنبيهات المخصص (Toast)
        function showToast(msg, isSuccess) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            if(isSuccess) {
                toast.classList.add('success');
            } else {
                toast.classList.remove('success');
            }
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }
    </script>
</body>
</html>
